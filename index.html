<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSU/JU München – Orts- und Kreisverbände</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; z-index: 1000; top: 10px; left: 50px; max-width: 340px;
    background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
    padding: 10px 12px; font-size: 14px;
  }
  #panel h1 { font-size: 15px; margin: 0 0 6px; }
  #panel form { display: flex; gap: 4px; margin-bottom: 6px; }
  #panel input { flex: 1; padding: 4px 6px; font: inherit; }
  #panel button { font: inherit; padding: 4px 8px; cursor: pointer; }
  #info table { border-collapse: collapse; width: 100%; }
  #info td { padding: 2px 4px; vertical-align: top; }
  #info td:first-child { color: #666; white-space: nowrap; }
  #info .ov { font-weight: 600; font-size: 16px; }
  .hint { color: #666; font-size: 12px; }
  .ov-label { background: none; border: none; box-shadow: none; font-size: 11px; font-weight: 600;
              color: #222; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  .legend { background: #fff; padding: 6px 8px; border-radius: 6px; font-size: 12px; line-height: 18px;
            box-shadow: 0 1px 5px rgba(0,0,0,.3); }
  .legend i { display: inline-block; width: 14px; height: 10px; margin-right: 5px; vertical-align: middle; }
  @media (max-width: 600px) { #panel { left: 10px; right: 10px; top: auto; bottom: 20px; max-width: none; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>CSU/JU München – Wo bin ich?</h1>
  <form id="search">
    <input id="q" placeholder="Adresse in München …" autocomplete="off">
    <button type="submit" title="Adresse suchen">🔍</button>
    <button type="button" id="locate" title="Meinen Standort verwenden">📍</button>
  </form>
  <div id="info"><span class="hint">Klick auf die Karte, Adresse eingeben oder 📍 drücken.</span></div>
</div>

<script>
// ---- Konfiguration -------------------------------------------------------
const DATA = {
  ov:  'data/ortsverbaende.geojson',        // Eigenschaften: ov, kv, stadtbezirke
  ltw: 'data/landtagsstimmkreise.geojson',  // nr, name
  btw: 'data/bundestagswahlkreise.geojson', // nr, name
};
const KV_FARBEN = ['#1b9e77','#d95f02','#7570b3','#e7298a','#66a61e','#e6ab02','#a6761d','#1f78b4','#b2df8a','#fb9a99'];
const UNBEKANNT = '#999999';

// ---- Geometrie: Punkt-in-Polygon (Ray Casting) ---------------------------
function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inPolygon(x, y, rings) {
  if (!inRing(x, y, rings[0])) return false;
  for (let k = 1; k < rings.length; k++) if (inRing(x, y, rings[k])) return false;
  return true;
}
function contains(feature, lng, lat) {
  const g = feature.geometry;
  if (g.type === 'Polygon') return inPolygon(lng, lat, g.coordinates);
  if (g.type === 'MultiPolygon') return g.coordinates.some(p => inPolygon(lng, lat, p));
  return false;
}
const finde = (fc, lat, lng) => fc ? fc.features.find(f => contains(f, lng, lat)) : undefined;

// ---- Karte ---------------------------------------------------------------
const map = L.map('map', { zoomControl: true }).setView([48.137, 11.575], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · ' +
               'Grenzen: © LH München (dl-de/by-2-0)'
}).addTo(map);
map.createPane('overlays').style.zIndex = 450;
map.getPane('overlays').style.pointerEvents = 'none';

let daten = {}, ovLayer, auswahlLayer, marker;
const kvFarbe = {};

function farbeFuer(kv) {
  if (!kv || kv.includes('?')) return UNBEKANNT;
  if (!(kv in kvFarbe)) kvFarbe[kv] = KV_FARBEN[Object.keys(kvFarbe).length % KV_FARBEN.length];
  return kvFarbe[kv];
}

const laden = url => fetch(url).then(r => { if (!r.ok) throw new Error(url + ': ' + r.status); return r.json(); });

Promise.all([laden(DATA.ov), laden(DATA.ltw), laden(DATA.btw)]).then(([ov, ltw, btw]) => {
  daten = { ov, ltw, btw };
  // KV-Farben in fester Reihenfolge vergeben
  [...new Set(ov.features.map(f => f.properties.kv))].sort((a, b) => a.localeCompare(b, 'de', { numeric: true })).forEach(farbeFuer);

  ovLayer = L.geoJSON(ov, {
    style: f => ({ color: '#333', weight: 1, fillColor: farbeFuer(f.properties.kv), fillOpacity: 0.35 }),
    onEachFeature: (f, layer) => {
      layer.bindTooltip(`${f.properties.ov} <span style="color:#666">(${f.properties.kv || 'KV ?'})</span>`, { sticky: true });
    }
  }).addTo(map);

  const ltwLayer = L.geoJSON(ltw, {
    pane: 'overlays', interactive: false,
    style: { color: '#c00', weight: 3, dashArray: '8 6', fill: false },
  });
  const btwLayer = L.geoJSON(btw, {
    pane: 'overlays', interactive: false,
    style: { color: '#0039a6', weight: 4, dashArray: '2 8', lineCap: 'round', fill: false },
  });
  const ovNamen = L.layerGroup(ov.features.map(f =>
    L.marker(L.geoJSON(f).getBounds().getCenter(), { opacity: 0, interactive: false })
      .bindTooltip(f.properties.ov, { permanent: true, direction: 'center', className: 'ov-label' })));

  L.control.layers(null, {
    'Ortsverbände': ovLayer,
    'OV-Namen': ovNamen,
    '<span style="color:#c00">▬ ▬</span> Landtagsstimmkreise 2023': ltwLayer,
    '<span style="color:#0039a6">• • •</span> Bundestagswahlkreise 2025': btwLayer,
  }, { collapsed: window.innerWidth < 600 }).addTo(map);
  ltwLayer.addTo(map);

  const legende = L.control({ position: 'bottomright' });
  legende.onAdd = () => {
    const d = L.DomUtil.create('div', 'legend');
    d.innerHTML = Object.entries(kvFarbe).map(([kv, c]) => `<i style="background:${c}"></i>${kv}`).join('<br>') +
      (ov.features.some(f => !f.properties.kv || f.properties.kv.includes('?'))
        ? `<br><i style="background:${UNBEKANNT}"></i>KV noch offen` : '');
    return d;
  };
  legende.addTo(map);
  map.fitBounds(ovLayer.getBounds());

  // Position aus URL-Hash wiederherstellen (#48.15,11.56)
  const m = location.hash.match(/^#(-?[\d.]+),(-?[\d.]+)/);
  if (m) zeige(+m[1], +m[2], 'Link');
}).catch(e => {
  document.getElementById('info').innerHTML =
    `<b style="color:#c00">Daten konnten nicht geladen werden.</b><br><span class="hint">${e.message}<br>` +
    `Die Seite muss über einen Webserver geöffnet werden (nicht per Doppelklick als file://).</span>`;
});

// ---- Abfrage -------------------------------------------------------------
function zeige(lat, lng, quelle) {
  const ov = finde(daten.ov, lat, lng), ltw = finde(daten.ltw, lat, lng), btw = finde(daten.btw, lat, lng);
  if (marker) marker.setLatLng([lat, lng]); else marker = L.marker([lat, lng]).addTo(map);
  if (auswahlLayer) map.removeLayer(auswahlLayer);
  if (ov) auswahlLayer = L.geoJSON(ov, { style: { color: '#000', weight: 3, fill: false }, interactive: false }).addTo(map);
  history.replaceState(null, '', `#${lat.toFixed(5)},${lng.toFixed(5)}`);

  const info = document.getElementById('info');
  if (!ov && !ltw && !btw) {
    info.innerHTML = '<span class="hint">Dieser Punkt liegt außerhalb Münchens.</span>';
    return;
  }
  const p = ov ? ov.properties : {};
  info.innerHTML = `<table>
    <tr><td>Ortsverband</td><td class="ov">${ov ? p.ov : '–'}</td></tr>
    <tr><td>Kreisverband</td><td><i style="display:inline-block;width:10px;height:10px;background:${farbeFuer(p.kv)}"></i> ${p.kv || '–'}</td></tr>
    ${p.stadtbezirke ? `<tr><td>Stadtbezirk</td><td>${[].concat(p.stadtbezirke).join(', ')}</td></tr>` : ''}
    <tr><td>Landtag</td><td>${ltw ? `Stimmkreis ${ltw.properties.nr} ${ltw.properties.name}` : '–'}</td></tr>
    <tr><td>Bundestag</td><td>${btw ? `Wahlkreis ${btw.properties.nr} ${btw.properties.name}` : '–'}</td></tr>
  </table><div class="hint">${quelle}: ${lat.toFixed(5)}, ${lng.toFixed(5)}</div>`;
}

map.on('click', e => zeige(e.latlng.lat, e.latlng.lng, 'Klick'));

document.getElementById('locate').onclick = () => {
  if (!navigator.geolocation) { document.getElementById('info').innerHTML = '<span class="hint">Standortbestimmung wird nicht unterstützt.</span>'; return; }
  navigator.geolocation.getCurrentPosition(
    pos => { const { latitude: la, longitude: lo } = pos.coords; map.setView([la, lo], 15); zeige(la, lo, 'Standort'); },
    err => document.getElementById('info').innerHTML = `<span class="hint">Standort nicht verfügbar: ${err.message}</span>`,
    { enableHighAccuracy: true, timeout: 10000 });
};

document.getElementById('search').onsubmit = ev => {
  ev.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de' +
              '&viewbox=11.36,48.25,11.73,48.06&bounded=1&q=' + encodeURIComponent(q);
  fetch(url).then(r => r.json()).then(res => {
    if (!res.length) { document.getElementById('info').innerHTML = '<span class="hint">Adresse nicht gefunden.</span>'; return; }
    const la = +res[0].lat, lo = +res[0].lon;
    map.setView([la, lo], 16);
    zeige(la, lo, res[0].display_name.split(',').slice(0, 3).join(','));
  });
};
</script>
</body>
</html>
